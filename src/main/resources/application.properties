spring.application.name=summary-data

# === News API 進階設定 ===
newsapi.key=${NEWS_API_KEY}
newsapi.url=https://newsapi.org/v2/everything
# 使用 Unicode 避免亂碼：科技 OR 商業 OR AI
newsapi.query=\u79D1\u6280 OR \u5546\u696D OR AI
newsapi.language=zh
newsapi.pageSize=25
newsapi.sortBy=popularity

# 排程設定：每天早上 9 點
app.cron.expression=0 0 9 * * ?


spring.datasource.url=jdbc:mysql://localhost:3306/opv_import_data

spring.datasource.username=root

spring.datasource.password=9876


spring.sql.init.mode=always
spring.datasource.initialization-mode=always
spring.datasource.sql-script-encoding=UTF-8


logging.config=classpath:log4j2.xml